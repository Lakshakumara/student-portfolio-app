<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f1ece1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b48328"/>
      <stop offset="35%" stop-color="#f6d365"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a6e1a"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Parchment / Certificate Paper Background -->
  <rect x="0" y="0" width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Ornate Outer Gold Border -->
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="10"/>
  <rect x="47" y="47" width="1106" height="756" fill="none" stroke="#1e293b" stroke-width="2" rx="6"/>
  <rect x="55" y="55" width="1090" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Corner Filigree Ornaments -->
  <g fill="url(#goldGrad)">
    <!-- Top-Left -->
    <path d="M 60 60 L 140 60 L 140 66 L 66 66 L 66 140 L 60 140 Z"/>
    <circle cx="85" cy="85" r="10"/>
    <circle cx="105" cy="85" r="5"/>
    <circle cx="85" cy="105" r="5"/>
    <!-- Top-Right -->
    <path d="M 1140 60 L 1060 60 L 1060 66 L 1134 66 L 1134 140 L 1140 140 Z"/>
    <circle cx="1115" cy="85" r="10"/>
    <circle cx="1095" cy="85" r="5"/>
    <circle cx="1115" cy="105" r="5"/>
    <!-- Bottom-Left -->
    <path d="M 60 790 L 140 790 L 140 784 L 66 784 L 66 710 L 60 710 Z"/>
    <circle cx="85" cy="765" r="10"/>
    <circle cx="105" cy="765" r="5"/>
    <circle cx="85" cy="745" r="5"/>
    <!-- Bottom-Right -->
    <path d="M 1140 790 L 1060 790 L 1060 784 L 1134 784 L 1134 710 L 1140 710 Z"/>
    <circle cx="1115" cy="765" r="10"/>
    <circle cx="1095" cy="765" r="5"/>
    <circle cx="1115" cy="745" r="5"/>
  </g>

  <!-- Top Chess Emblem -->
  <g transform="translate(600, 140)" filter="url(#shadow)" text-anchor="middle">
    <circle cx="0" cy="0" r="42" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Knight Symbol -->
    <path d="M -15 22 L 15 22 L 13 16 C 13 16 11 12 11 8 C 11 2 16 -3 14 -12 C 12 -21 5 -25 -2 -25 C -10 -25 -16 -18 -16 -10 C -16 -4 -13 0 -13 4 C -18 8 -19 15 -15 22 Z" fill="url(#goldGrad)"/>
    <circle cx="-5" cy="-12" r="2.5" fill="#1e293b"/>
  </g>

  <!-- Header Text -->
  <text x="600" y="225" text-anchor="middle" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="4">
    SRI LANKA SCHOOLS CHESS ASSOCIATION
  </text>
  <text x="600" y="252" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="2">
    ANNUAL INTER-SCHOOL &amp; DISTRICT CHESS TOURNAMENT
  </text>

  <!-- Title -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">
    Certificate of Merit &amp; Participation
  </text>

  <!-- Awarded to text -->
  <text x="600" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-style="italic" fill="#475569">
    This certificate is proudly awarded to
  </text>

  <!-- Recipient Name -->
  <text x="600" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="1">
    Y.N.A. DEWMINI
  </text>
  <line x1="320" y1="465" x2="880" y2="465" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Description Body -->
  <text x="600" y="515" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" fill="#334155" font-weight="500">
    In recognition of outstanding strategic prowess, sportsmanship, and active participation
  </text>
  <text x="600" y="545" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" fill="#334155" font-weight="500">
    in the Competitive Mind Sports Championship, demonstrating exemplary analytical reasoning and discipline.
  </text>

  <!-- Badge Details / Category -->
  <rect x="420" y="585" width="360" height="38" rx="19" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="1">
    MIND SPORT · TOURNAMENT COMPETITOR
  </text>

  <!-- Official Gold Seal -->
  <g transform="translate(230, 680)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="800" fill="#78350f" letter-spacing="1">SLSCA</text>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="800" fill="#78350f">OFFICIAL</text>
    <text x="0" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="800" fill="#78350f">SEAL</text>
  </g>

  <!-- Signatures -->
  <!-- Left Signature -->
  <g transform="translate(480, 700)" text-anchor="center">
    <path d="M 0 0 C 15 -18, 30 -5, 50 -15 C 70 -25, 80 5, 110 -12" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="-15" y1="12" x2="135" y2="12" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a">W. K. Gunasekara</text>
    <text x="60" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Tournament Director</text>
  </g>

  <!-- Right Signature -->
  <g transform="translate(820, 700)" text-anchor="center">
    <path d="M 0 -8 C 25 10, 40 -20, 70 -5 C 90 8, 105 -15, 125 -10" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="-15" y1="12" x2="135" y2="12" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a">P. Jayawardena</text>
    <text x="60" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">President, SLSCA</text>
  </g>

  <!-- Date & Verification -->
  <text x="600" y="785" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
    CREDENTIAL ID: SLSCA-TOURN-882 · VERIFIED MERIT AWARD
  </text>
</svg>
